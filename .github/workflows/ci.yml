# CI interno de Mefisto (issue #1743). No se distribuye al consumidor (MEF-ADR-0019).
# Corre la regresion completa en TODOS los PRs contra main, sin filtro 'paths:':
# un workflow saltado por 'paths:' deja el check requerido en "Pending" y bloquea el merge.
# El nombre del job ("tests") es el check estable que exige el ruleset de main: no renombrar.
# Corre en macOS (arm64, runner pinneado, nunca 'macos-latest'): Mefisto se opera en macOS con
# /bin/bash 3.2 y coreutils BSD; un CI en Linux daba rojos/verdes que no dicen nada del sistema real.
# Neutral a runtime (MEF-ADR-0050): solo bash, coreutils, git y jq; sin CLIs de agente ni secretos.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Paridad con la ejecucion real: la suite corre dentro de un pipeline que fija el runtime.
      MEFISTO_RUNTIME: claude
    steps:
      - uses: actions/checkout@v4

      - name: Entorno del runner
        run: |
          uname -sm
          sw_vers -productVersion
          /bin/bash --version | head -n 1

      - name: Instalar herramientas faltantes
        run: |
          for tool in jq shellcheck tmux; do
            command -v "$tool" >/dev/null 2>&1 || brew install "$tool"
          done

      - name: Paridad de git con macOS local
        # El git de Apple CLT trae init.defaultBranch=main en su gitconfig de sistema; el git del runner no.
        run: git config --global init.defaultBranch main

      - name: Verificar herramientas
        run: |
          for tool in jq shellcheck tmux; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::$tool no esta disponible en el runner" >&2; exit 1; }
          done
          jq --version

      - name: Adaptadores internos sincronizados
        run: src/internal/scripts/generate-internal-adapters.sh --check

      - name: Validar artefactos internos
        run: src/internal/scripts/validate-internal-artifacts.sh

      - name: Suite completa de tests
        run: src/internal/scripts/mefisto-test-suite.sh --log-dir "$RUNNER_TEMP/test-suite-logs"

      - name: Subir logs de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-logs
          path: ${{ runner.temp }}/test-suite-logs
          if-no-files-found: warn
