# CI interno de Mefisto (issues #1743, #1766). No se distribuye al consumidor (MEF-ADR-0019).
# Nightly: la suite completa corre una vez por noche a las 3 AM hora local (UTC-5), es decir
# 08:00 UTC, porque GitHub programa 'schedule' en UTC. Ningun PR corre tests: este workflow no
# se dispara en 'pull_request' ni en 'push'; tambien se puede lanzar a mano con 'workflow_dispatch'.
# Doc oficial de GitHub (events-that-trigger-workflows, evento 'schedule'):
#   https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
#   (a) la ejecucion programada puede retrasarse en periodos de alta carga (p. ej. al inicio de cada hora);
#   (b) en un repositorio publico, los workflows programados se deshabilitan automaticamente tras
#       60 dias sin actividad en el repositorio; hay que reactivarlos a mano en la pestana Actions.
# El fallo de la nightly es visible en Actions (la notificacion automatica es el issue #1770).
# Corre en macOS (arm64, runner pinneado, nunca 'macos-latest'): Mefisto se opera en macOS con
# /bin/bash 3.2 y coreutils BSD; un CI en Linux daba rojos/verdes que no dicen nada del sistema real.
# Neutral a runtime (MEF-ADR-0050): solo bash, coreutils, git y jq; sin CLIs de agente ni secretos.
name: CI

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Entorno del runner
        run: |
          uname -sm
          sw_vers -productVersion
          /bin/bash --version | head -n 1

      - name: Instalar jq si falta
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Verificar herramientas
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq no esta disponible en el runner" >&2
            exit 1
          fi
          jq --version

      - name: Adaptadores internos sincronizados
        run: src/internal/scripts/generate-internal-adapters.sh --check

      - name: Validar artefactos internos
        run: src/internal/scripts/validate-internal-artifacts.sh

      - name: Suite completa de tests
        run: src/internal/scripts/mefisto-test-suite.sh --log-dir "$RUNNER_TEMP/test-suite-logs"

      - name: Subir logs de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-logs
          path: ${{ runner.temp }}/test-suite-logs
          if-no-files-found: warn
