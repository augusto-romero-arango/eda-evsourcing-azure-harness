# CI interno de Mefisto (issues #1743, #1766). No se distribuye al consumidor (MEF-ADR-0019).
# Nightly: la suite completa corre una vez por noche a las 3 AM hora local (UTC-5), es decir
# 08:00 UTC, porque GitHub programa 'schedule' en UTC. Ningun PR corre tests: este workflow no
# se dispara en 'pull_request' ni en 'push'; tambien se puede lanzar a mano con 'workflow_dispatch'.
# Doc oficial de GitHub (events-that-trigger-workflows, evento 'schedule'):
#   https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
#   (a) la ejecucion programada puede retrasarse en periodos de alta carga (p. ej. al inicio de cada hora);
#   (b) en un repositorio publico, los workflows programados se deshabilitan automaticamente tras
#       60 dias sin actividad en el repositorio; hay que reactivarlos a mano en la pestana Actions.
# El fallo de la nightly se avisa con un issue 'nightly-rojo' (job 'notify', issue #1773).
# Corre en macOS (arm64, runner pinneado, nunca 'macos-latest'): Mefisto se opera en macOS con
# /bin/bash 3.2 y coreutils BSD; un CI en Linux daba rojos/verdes que no dicen nada del sistema real.
# Neutral a runtime (MEF-ADR-0050): solo bash, coreutils, git y jq; sin CLIs de agente ni secretos.
name: CI

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Paridad con la ejecucion real: la suite corre dentro de un pipeline que fija el runtime.
      MEFISTO_RUNTIME: claude
    steps:
      - uses: actions/checkout@v4

      - name: Entorno del runner
        run: |
          uname -sm
          sw_vers -productVersion
          /bin/bash --version | head -n 1

      - name: Instalar herramientas faltantes
        run: |
          for tool in jq shellcheck tmux; do
            command -v "$tool" >/dev/null 2>&1 || brew install "$tool"
          done

      - name: Paridad de git con macOS local
        # El git de Apple CLT trae init.defaultBranch=main en su gitconfig de sistema; el git del runner no.
        run: git config --global init.defaultBranch main

      - name: Verificar herramientas
        run: |
          for tool in jq shellcheck tmux; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::$tool no esta disponible en el runner" >&2; exit 1; }
          done
          jq --version

      - name: Adaptadores internos sincronizados
        run: src/internal/scripts/generate-internal-adapters.sh --check

      - name: Validar artefactos internos
        run: src/internal/scripts/validate-internal-artifacts.sh

      - name: Suite completa de tests
        run: src/internal/scripts/mefisto-test-suite.sh --log-dir "$RUNNER_TEMP/test-suite-logs"

      - name: Subir logs de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-logs
          path: ${{ runner.temp }}/test-suite-logs
          if-no-files-found: warn

  # Solo 'schedule' notifica (#1773): un workflow_dispatch manual es exploratorio y no abre ni cierra el issue.
  # Permisos por job: solo este job tiene 'issues: write'; 'tests' conserva 'contents: read'.
  #   https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
  # Notificacion de fallos de workflows programados (va al usuario que creo/edito por ultima vez el cron):
  #   https://docs.github.com/en/actions/monitoring-and-troubleshooting-workflows/notifications-for-workflow-runs
  # Corre en Linux (pinneado, nunca 'ubuntu-latest'): solo publica con gh, no evalua el sistema real.
  notify:
    name: notify
    needs: tests
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTS_RESULT: ${{ needs.tests.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar logs de la suite
        if: ${{ needs.tests.result != 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-suite-logs
          path: ${{ runner.temp }}/test-suite-logs

      - name: Abrir, comentar o cerrar el issue de la nightly
        run: |
          set -euo pipefail
          open_number="$(gh issue list --label nightly-rojo --state open --json number --jq '.[0].number // empty')"
          case "$TESTS_RESULT" in
            failure|cancelled|timed_out)
              body_file="$RUNNER_TEMP/nightly-body.md"
              src/internal/scripts/mefisto-nightly-report.sh "$RUNNER_TEMP/test-suite-logs" "$RUN_URL" "$GITHUB_SHA" > "$body_file"
              if [ -n "$open_number" ]; then
                gh issue comment "$open_number" --body-file "$body_file"
              else
                gh label create nightly-rojo --color B60205 --description "La nightly de CI esta roja" 2>/dev/null || true
                gh issue create --title "Corregir la nightly roja" \
                  --label nightly-rojo --label bug --label tipo:tooling \
                  --body-file "$body_file"
              fi
              ;;
            success)
              if [ -n "$open_number" ]; then
                gh issue close "$open_number" --reason completed \
                  --comment "La nightly volvio a verde: $RUN_URL"
              fi
              ;;
          esac
